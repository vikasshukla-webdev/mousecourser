<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
#heading:hover{
    color: red;
}
        .parent{
            border: 2px solid purple;
            height: 300px;
            width: 500px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            background-color: rgba(72, 17, 148, 0.729);

        }
        .child{
            height: 150px;
            width: 300px;
            border: 2px solid orchid;
         margin: 40px;
            justify-items: center;
            align-content: center;
            background-color: rgba(70, 18, 98, 0.534);
            border-radius:10px 10px 5px;

        }
        button{
            justify-content: center;
            align-content: center;
            margin-left: 150px;
            height:40px ;
            width: 100px;
            border-radius: 5px 4px 5px;
            background-color: rgba(40, 25, 195, 0.819);

        }
        .follower{
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background-color: brown;
            transition: all 0.3s linear;
        }
    </style>
</head>
<body>
    <div class="follower">

    </div>

    <h1 id="heading">Event Bubbling</h1>

    <p> Event Bubbling is a machanism in js where an event triggered on an inner element will automatically propagate(move)to its parent element->step by step-> until it reaches the top-most element.
    </p>

    <div class="parent">
        <h1>Hi! Parent ☺️</h1>
        <div class=child><h2>hello child</h2>
            <button class="button">click me</button>
          
        </child-box>
    </div>
 



    <script>
 let parent=document.querySelector(".parent");
 let child=document.querySelector(".child");
 let button=document.querySelector(".button");
 parent.addEventListener("click" ,(e)=>{
    e.stopPropagation();
    alert('This is parent container');
 });
  child.addEventListener("click",(e)=>{
    e.stopPropagation();
    alert('This is child container');

  });
  button.addEventListener("click",(e)=>{
    e.stopPropagation();
    alert('this is button in child container of parent');
  
  });    

 let follower=document.querySelector(".follower");
  document.addEventListener("mousemove", (e) => {
   
     let { clientX ,clientY } = e;
     follower.style.transform = `translate(${clientX}px, ${clientY}px)`;
    // follower.style.transform`tranlate(${clientX}px, ${clientY}px)`;
  })
 

 </script>


</body>
</html>
